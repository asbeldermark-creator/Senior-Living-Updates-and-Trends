# Senior Living Industry Trends — Bi-Weekly Report Workflow
# This file documents the intended automation pipeline.
# Actual report generation is handled by the Cowork scheduled task (Claude agent).
# This workflow validates repo structure and can trigger manual report generation.

name: Bi-Weekly Industry Trends Report

on:
  schedule:
    # Runs on the 1st and 15th of every month at 8:00 AM CT (14:00 UTC)
    - cron: '0 14 1 * *'
    - cron: '0 14 15 * *'
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Report date (YYYY-MM-DD). Defaults to today.'
        required: false
        default: ''

jobs:
  validate-repo:
    name: Validate Repository Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required files exist
        run: |
          echo "Checking repository structure..."
          test -f index.html && echo "✅ index.html present"
          test -f _trends-data.json && echo "✅ _trends-data.json present"
          test -d reports && echo "✅ reports/ directory present"
          echo "Report count: $(ls reports/*.html 2>/dev/null | wc -l)"
          echo "Latest report: $(ls -t reports/*.html 2>/dev/null | head -1)"

      - name: Validate trends data JSON
        run: |
          echo "Validating _trends-data.json..."
          python3 -c "
          import json, sys
          with open('_trends-data.json') as f:
              data = json.load(f)
          trends = data.get('trends', [])
          print(f'✅ JSON valid — {len(trends)} trends tracked')
          print(f'   Last updated: {data[\"meta\"][\"last_updated\"]}')
          print(f'   Report count: {data[\"meta\"][\"report_count\"]}')
          for t in trends:
              assert 'id' in t and 'heat' in t and 'breadth' in t, f'Missing fields in {t}'
          print('✅ All trend entries valid')
          "

      - name: Report generation reminder
        run: |
          echo ""
          echo "==========================================="
          echo "REPORT GENERATION NOTE"
          echo "==========================================="
          echo "This workflow validates repo structure only."
          echo "Report generation is handled by the Cowork"
          echo "scheduled task (Claude agent) which:"
          echo "  1. Researches publications for new trends"
          echo "  2. Monitors competitor news"
          echo "  3. Generates the full HTML report"
          echo "  4. Updates _trends-data.json continuity"
          echo "  5. Updates index.html archive listing"
          echo "  6. Pushes all changes to this repo"
          echo "==========================================="
